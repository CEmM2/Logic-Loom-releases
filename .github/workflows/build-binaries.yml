name: Build & Release Binaries

# Binary build for the two-repo release model.
#
# THIS repo (CEmM2/Logic-Loom-releases) owns the cross-platform binary build.
# The source is the public repository CEmM2/Logic-Loom; this workflow checks it
# out at the release tag, builds macOS/Linux/Windows bundles on real runners,
# and attaches them (plus SHA256SUMS.txt) to the GitHub Release for the tag on
# THIS repo. The source-only release is cut separately by the source repo's
# `release.yml` on the same tag.
#
# Trigger: push a `v*` tag to THIS repo (e.g. `git push origin v0.3.0`).
# A manual run builds any ref of the source repo (a tag, or `main`) on all
# three systems WITHOUT publishing, which is the dry run to do before tagging.
#
# No secrets are needed: the source and every Python dependency (AKMS, MechDSL,
# zotero-summarizer) are public, and the Release is created with GITHUB_TOKEN.
#
# Out of scope (deliberate, follow-ups): macOS notarization, Windows
# authenticode signing. Both need org signing secrets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Ref of CEmM2/Logic-Loom to build: a release tag (v0.3.0) or a branch (main). Manual runs never publish."
        required: true
        default: "main"

permissions:
  contents: read

env:
  SOURCE_REPO: CEmM2/Logic-Loom
  # Resolve the tag once: the pushed tag, or the manual-dispatch input.
  BUILD_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Newest glibc symbol version any shipped Linux ELF may require. 2.35 is
  # Ubuntu 22.04; it covers Ubuntu 22.04/24.04 and Debian 12/13.
  GLIBC_FLOOR: "2.35"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build per-OS artifacts in parallel from the public source at BUILD_TAG.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_glob: "apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg"
          # Linux is pinned to the OLDEST supported runner, not ubuntu-latest.
          # A Linux binary needs a glibc at least as new as the one it was
          # linked against, and v0.3.0 was built on ubuntu-latest (glibc 2.43),
          # so it refused to start on Debian 13 (2.41) and Ubuntu 24.04 (2.39).
          # ubuntu-22.04 (glibc 2.35) is also the oldest base that ships
          # webkit2gtk-4.1, which Tauri 2 needs. The "Check Linux glibc floor"
          # step below fails the build if anything shipped needs more than
          # GLIBC_FLOOR. When GitHub retires this image, keep the floor by
          # running the job in an `ubuntu:22.04` container instead of moving
          # to a newer runner.
          - os: ubuntu-22.04
            target: linux
            artifact_glob: "apps/desktop/src-tauri/target/release/bundle/{deb,appimage}/*"
          - os: windows-latest
            target: windows
            artifact_glob: "apps/desktop/src-tauri/target/release/bundle/{msi,nsis}/*"

    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.BUILD_TAG }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (uses node:sqlite builtin).
          node-version: "22"

      - uses: pnpm/action-setup@v4
        # Version comes from package.json's packageManager field.

      - name: Install uv
        run: pip install uv

      - name: Sync Python deps (with logic-loom-api dev extras)
        run: uv sync --locked --package logic-loom-api --all-extras

      - name: Sync curated AKMS Claude assets into resources/
        run: uv run python scripts/sync_akms_claude_assets.py

      - name: Run resources/ Nodes_Vault security guard
        run: python3 scripts/check_resources_no_vault.py

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + Tauri target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      - name: Install Linux Tauri runtime dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libglib2.0-dev

      - name: Build (${{ matrix.target }})
        shell: bash
        run: pnpm logic-loom:package:${{ matrix.target }}

      - name: Check Linux glibc floor and bundled WebKitGTK
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          sidecar=apps/desktop/src-tauri/binaries/logic-loom-api
          work="$RUNNER_TEMP/glibc-check"
          rm -rf "$work" && mkdir -p "$work/deb"

          # Highest GLIBC_x.y version REQUIRED (the ELF "Version References",
          # not versions a library defines) by any ELF file under $1.
          max_glibc() {
            find "$1" -type f -print0 | while IFS= read -r -d '' f; do
              [ "$(head -c4 "$f" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ] || continue
              objdump -p "$f" 2>/dev/null | sed -n '/^Version References:/,/^$/p' \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' || true
            done | sed 's/^GLIBC_//' | sort -uV | tail -n1
          }
          fail=0
          check() {  # label, path
            local found
            found="$(max_glibc "$2")"
            echo "$1: needs glibc ${found:-none} (floor $GLIBC_FLOOR)"
            if [ -n "$found" ] && [ "$(printf '%s\n%s\n' "$found" "$GLIBC_FLOOR" | sort -V | tail -n1)" != "$GLIBC_FLOOR" ]; then
              echo "::error::$1 needs glibc $found, newer than the floor $GLIBC_FLOOR"
              fail=1
            fi
          }

          appimage="$(ls "$bundle"/appimage/*.AppImage | head -n1)"
          deb="$(ls "$bundle"/deb/*.deb | head -n1)"
          chmod +x "$appimage"
          ( cd "$work" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null )
          dpkg-deb -x "$deb" "$work/deb"

          check "AppImage ($(basename "$appimage"))" "$work/squashfs-root"
          check "deb ($(basename "$deb"))" "$work/deb"
          check "sidecar" "$sidecar"

          # The AppImage must carry its own WebKitGTK, so it runs on systems
          # where the distro package is missing or cannot be installed. The
          # .deb deliberately depends on the distro's libwebkit2gtk-4.1-0.
          if find "$work/squashfs-root" -name 'libwebkit2gtk-4.1.so*' | grep -q .; then
            echo "AppImage bundles WebKitGTK: yes"
          else
            echo "::error::AppImage does not bundle libwebkit2gtk-4.1"
            fail=1
          fi
          echo "deb Depends: $(dpkg-deb -f "$deb" Depends)"
          exit "$fail"

      - name: Smoke-test the Linux sidecar on a clean older distro
        if: matrix.target == 'linux'
        shell: bash
        run: |
          # The sidecar is a PyInstaller one-file binary: the libraries it
          # unpacks at run time are not visible to the objdump scan above, so
          # run it in a bare Debian 12 container (glibc 2.36, nothing from the
          # build host) and wait for the handshake line the desktop shell needs.
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries:/opt/ll:ro" \
            -e HOME=/tmp debian:12-slim \
            bash -c 'timeout 180 /opt/ll/logic-loom-api --auto-port > /tmp/out.log 2>&1 & pid=$!
              for _ in $(seq 1 180); do
                if grep -q "^LOGIC_LOOM_API_READY:" /tmp/out.log; then
                  grep "^LOGIC_LOOM_API_READY:" /tmp/out.log; kill "$pid" || true; exit 0
                fi
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              echo "sidecar did not reach the handshake:"; cat /tmp/out.log; exit 1'

      - name: Stage artifacts for upload
        shell: bash
        run: |
          mkdir -p dist-${{ matrix.target }}
          shopt -s nullglob
          cp ${{ matrix.artifact_glob }} dist-${{ matrix.target }}/ || true
          ls -lh dist-${{ matrix.target }}/

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          cd dist-${{ matrix.target }}
          if [ -z "$(ls -A)" ]; then
            echo "::error::No artifacts produced for ${{ matrix.target }}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logic-loom-${{ matrix.target }}
          path: dist-${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Aggregate the three per-OS artifact sets onto the Release on THIS repo.
  # Release notes are read from the source at the tag.
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish Binaries to Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write  # create/update the Release on THIS repo

    steps:
      - name: Checkout source at tag (for release notes)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.BUILD_TAG }}
          persist-credentials: false
          path: source

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find dist/ -type f \
            \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \
               -o -name "*.msi" -o -name "*.exe" -o -name "SHA256SUMS" \) \
            -exec cp {} release-assets/ \;
          # Per-OS SHA256SUMS collide on the same name; keep them distinct.
          ls -lh release-assets/ || true

      - name: Consolidate checksums
        shell: bash
        run: |
          cd release-assets
          rm -f SHA256SUMS
          { command -v sha256sum >/dev/null 2>&1 && sha256sum * || shasum -a 256 *; } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Locate release notes
        id: notes
        shell: bash
        run: |
          tag="${BUILD_TAG}"
          notes_file="source/docs/release_notes/${tag}.md"
          if [ -f "$notes_file" ]; then
            echo "found=$notes_file" >> "$GITHUB_OUTPUT"
            echo "Release notes located at $notes_file"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "::warning::No release notes at $notes_file — falling back to generic body."
          fi

      - name: Create / update Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: Logic-Loom ${{ env.BUILD_TAG }}
          files: release-assets/*
          body_path: ${{ steps.notes.outputs.found }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.BUILD_TAG, '-alpha') || contains(env.BUILD_TAG, '-beta') || contains(env.BUILD_TAG, '-rc') }}
          # GITHUB_TOKEN (contents: write) — release is on THIS repo.
